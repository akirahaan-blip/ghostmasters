<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ゴーストマスターズ スコア記録</title>
<link rel="icon" href="misdreavus.png">
<link rel="apple-touch-icon" href="misdreavus.png">
<style>
:root{
  --line:#dcdcdc;
  --bg:#fff;
  --fg:#222;
  --sub:#666;
  --plus:#0a6b3d;
  --minus:#b3261e;
  --accent:#4a2c6b;
  --scope:#6b3fa0;
}
*{box-sizing:border-box}
body{
  font-family:system-ui,-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;
  max-width:720px;margin:0 auto;padding:0 10px 60px;
  color:var(--fg);background:var(--bg);line-height:1.6;
}

/* タイトル（ムウマとムウマージ） */
.hero{
  display:flex;align-items:flex-end;justify-content:space-between;gap:6px;
  margin:0 -10px;padding:14px 12px 8px;
  background:linear-gradient(180deg,#f6f0fb 0%,#e4d6f2 100%);
  overflow:hidden;
}
.hero img{height:96px;width:auto;flex:none;filter:drop-shadow(0 3px 3px rgba(74,44,107,.25))}
.hero .l{transform:rotate(-6deg);animation:float 3.2s ease-in-out infinite}
.hero .r{animation:float 3.2s ease-in-out -1.6s infinite}
.hero-title{text-align:center;color:var(--accent);padding-bottom:6px;min-width:0}
.hero-title h1{margin:0;font-size:1.35em;letter-spacing:.04em;line-height:1.3}
.hero-title .sub{font-size:.78em;opacity:.8}
@keyframes float{0%,100%{translate:0 0}50%{translate:0 -6px}}
@media (prefers-reduced-motion:reduce){.hero img{animation:none}}

/* ベストスコア（画面上部に固定） */
.best{
  position:sticky;top:0;z-index:10;
  display:flex;align-items:center;gap:10px;
  background:var(--accent);color:#fff;
  margin:0 -10px 12px;padding:8px 14px;
  box-shadow:0 2px 6px rgba(0,0,0,.2);
}
.best img{height:40px;width:auto}
.best .ttl{font-size:.8em;opacity:.85}
.best .val{font-size:1.3em;font-weight:bold}

/* DAY */
details.day{border:1px solid var(--line);border-radius:10px;margin:10px 0;background:#fafafa}
details.day>summary{
  padding:10px 12px;font-weight:bold;cursor:pointer;list-style:none;
  display:flex;justify-content:space-between;align-items:center;
}
details.day>summary::-webkit-details-marker{display:none}
details.day>summary::before{content:"▶";font-size:.8em;margin-right:6px;color:var(--sub)}
details.day[open]>summary::before{content:"▼"}
.daybest{font-weight:normal;font-size:.85em;color:var(--sub)}

/* リサーチ枠 */
.slot{border-top:1px solid var(--line);padding:12px;background:#fff}
.slot:first-of-type{border-top:none}
.slot-head{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px}
.slot-no{font-weight:bold;color:var(--accent)}
.slot-score{font-size:1.15em;font-weight:bold;white-space:nowrap}
.slot-score.p{color:var(--plus)}
.slot-score.m{color:var(--minus)}
.label-input{width:100%;padding:6px;border:1px solid var(--line);border-radius:6px;font-size:1em}

/* ポケモン行 */
.mon{display:flex;align-items:center;gap:6px;margin:6px 0}
.mon select{flex:1;min-width:0;padding:6px;border:1px solid var(--line);border-radius:6px;font-size:1em}
.mon label{white-space:nowrap;font-size:.9em}
.mon .del{border:none;background:none;font-size:1.1em;cursor:pointer;padding:2px 6px;color:var(--sub)}
.count{font-size:.85em;color:var(--sub);margin-left:6px}

button{font-size:.95em;padding:7px 12px;border:1px solid var(--line);
  border-radius:6px;background:#fff;cursor:pointer}
button:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:8px}

/* 内訳 */
.detail{font-size:.85em;color:var(--sub);margin-top:8px;
  background:#f7f7f7;border-radius:6px;padding:8px;white-space:pre-wrap}
.detail .scoped{color:var(--scope);font-weight:bold}
.detail .zeroed{text-decoration:line-through;opacity:.6}
.detail .karakara{color:var(--minus);font-weight:bold}

/* シルフスコープ */
.scope-box{margin-top:8px;font-size:.95em}
.scope-note{font-size:.85em;color:var(--sub);margin-left:4px}

/* 写真 */
.photo{max-width:100%;border-radius:8px;margin-top:8px;display:block}
.result{margin-top:10px;padding:10px;border:2px solid var(--scope);border-radius:10px;background:#f6f0fb}
.result img{max-width:100%;border-radius:6px;display:block;-webkit-touch-callout:default}
.result .share{background:var(--accent);color:#fff;border-color:var(--accent);font-weight:bold}
.result .note{font-size:.8em;color:var(--sub);margin-top:6px}
.result a{font-size:.85em;color:var(--sub)}
.post-text{width:100%;min-height:90px;margin-top:8px;padding:8px;
  border:1px solid var(--line);border-radius:6px;font-size:.9em;font-family:inherit}
.hint{font-size:.8em;color:var(--sub);margin-top:20px;border-top:1px solid var(--line);padding-top:12px}
</style>
</head>
<body>

<header class="hero">
  <img class="l" src="misdreavus.png" alt="ムウマ">
  <div class="hero-title">
    <div class="sub">ポケモンスリープ</div>
    <h1>ゴーストマスターズ</h1>
    <div class="sub">～ムウマ編～ スコア記録</div>
  </div>
  <img class="r" src="mismagius.png" alt="ムウマージ">
</header>

<div class="best">
  <img src="misdreavus.png" alt="">
  <div>
    <div class="ttl">★ ベストスコア</div>
    <div class="val" id="bestVal">まだ記録がありません</div>
  </div>
</div>

<div id="days"></div>

<p class="hint">
シルフスコープを使うと、👻 が付いたポケモンのうち一番点の高い1体が2倍になります。<br>
記録はこの端末のブラウザ内にのみ保存されます。他の端末では見られません。<br>
写真は保存されないため、ページを開き直すと消えます（投稿用画像を作るときだけ使います）。
</p>

<script>
"use strict";

/* ============================================================
   スコア表（設計書 4.1）
   ゴーストとホゲータ系は加点、あく・ヨーギラス系・ニャオハ系・メリープ系は減点
   ヤミラミ・ミカルゲの-32は2倍済みの値
   ============================================================ */
const SCORE = {
  // 加点
  "ゴース":5, "ゴースト":12, "ゲンガー":22,
  "カゲボウズ":5, "ジュペッタ":16,
  "フワンテ":5, "フワライド":12,
  "バケッチャ":5, "パンプジン":20,
  "ミミッキュ":16,
  "ホゲータ":5, "アチゲータ":12, "ラウドボーン":20,
  // 減点（あく）
  "ブラッキー":-20,
  "ヤミカラス":-16, "ドンカラス":-20,
  "ニューラ":-16, "マニューラ":-20,
  "デルビル":-5, "ヘルガー":-12,
  "アブソル":-16,
  "ヤミラミ":-32, "ミカルゲ":-32,
  // 減点（あく以外）
  "ヨーギラス":-5, "サナギラス":-12, "バンギラス":-25,
  "ニャオハ":-5, "ニャローテ":-12, "マスカーニャ":-20,
  "メリープ":-5, "モココ":-12, "デンリュウ":-20,
  // 種族ボーナス用（個体点なし）
  "イーブイ":0
};

/* シルフスコープの候補（ゲーム上でゴーストタイプを持つ加点ポケモン）
   ホゲータ・アチゲータはほのお単タイプなので対象外。
   ヤミラミ・ミカルゲはゴーストだが減点なので対象外（設計書 4.4） */
const GHOST = new Set([
  "ゴース","ゴースト","ゲンガー","カゲボウズ","ジュペッタ",
  "フワンテ","フワライド","バケッチャ","パンプジン","ミミッキュ","ラウドボーン"
]);

/* 出現するとそのリサーチのスコアが0になる（設計書 4.6） */
const KARAKARA = "カラカラ";

/* 選択肢（グループ分け） */
const GROUPS = [
  { name:"加点（👻＝スコープ候補）", list:["ゴース","ゴースト","ゲンガー","カゲボウズ","ジュペッタ",
      "フワンテ","フワライド","バケッチャ","パンプジン","ミミッキュ",
      "ホゲータ","アチゲータ","ラウドボーン"] },
  { name:"減点（あく）", list:["ブラッキー","ヤミカラス","ドンカラス","ニューラ","マニューラ",
      "デルビル","ヘルガー","アブソル","ヤミラミ","ミカルゲ"] },
  { name:"減点", list:["ヨーギラス","サナギラス","バンギラス","ニャオハ","ニャローテ","マスカーニャ",
      "メリープ","モココ","デンリュウ"] },
  { name:"個体点なし（種族ボーナス用）", list:["イーブイ"] },
  { name:"スコアが0になる", list:[KARAKARA] }
];

/* 種族ボーナス（設計書 4.3）／色違いでもスコープでも倍にしない */
const FAMILIES = [
  { members:["カゲボウズ","ジュペッタ"],                 bonus:10 },
  { members:["バケッチャ","パンプジン"],                 bonus:10 },
  { members:["フワンテ","フワライド"],                   bonus:10 },
  { members:["ゴース","ゴースト","ゲンガー"],            bonus:20 },
  { members:["ホゲータ","アチゲータ","ラウドボーン"],    bonus:20 },
  { members:["ヤミカラス","ドンカラス"],                 bonus:-10 },
  { members:["ニューラ","マニューラ"],                   bonus:-10 },
  { members:["デルビル","ヘルガー"],                     bonus:-10 },
  { members:["イーブイ","ブラッキー"],                   bonus:-10 },
  { members:["ヨーギラス","サナギラス","バンギラス"],    bonus:-20 },
  { members:["ニャオハ","ニャローテ","マスカーニャ"],    bonus:-20 },
  { members:["メリープ","モココ","デンリュウ"],          bonus:-20 }
];

const DAYS = 7;        // イベント期間
const SLOTS_PER_DAY = 2;
const MAX_MONS = 10;   // 1リサーチあたりの上限
// むしトリたいかいと同じ github.io に置くと保存領域を共有するため、キーを分ける
const STORAGE_KEY = "ghostmasters_v1";
const SLOT_MARK = ["①","②"];

/* ============================================================
   状態
   ============================================================ */
function emptySlot(){ return { label:"", scope:false, mons:[] }; }

function createState(){
  return {
    version:1,
    days: Array.from({length:DAYS}, (_,i)=>({
      day: i+1,
      slots: Array.from({length:SLOTS_PER_DAY}, emptySlot)
    }))
  };
}

function loadState(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(!raw) return createState();
    const s = JSON.parse(raw);
    if(!s || s.version !== 1 || !Array.isArray(s.days)) return createState();
    // 形が壊れていても落ちないように埋め直す
    const fresh = createState();
    s.days.forEach((d,i)=>{
      if(i >= DAYS || !d || !Array.isArray(d.slots)) return;
      d.slots.forEach((sl,j)=>{
        if(j >= SLOTS_PER_DAY || !sl) return;
        fresh.days[i].slots[j] = {
          label: typeof sl.label === "string" ? sl.label : "",
          scope: sl.scope === true,
          mons: Array.isArray(sl.mons)
            ? sl.mons.slice(0, MAX_MONS).map(m => ({
                name: (m && typeof m.name === "string") ? m.name : "",
                shiny: !!(m && m.shiny)
              }))
            : []
        };
      });
    });
    return fresh;
  }catch(e){
    return createState();
  }
}

function save(){
  try{
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  }catch(e){
    console.warn("保存に失敗しました", e);
  }
}

const state = loadState();
const photos = {};      // 写真は保存しない（この変数の中だけに持つ）
const views  = [];      // 各リサーチ枠のDOM参照

/* ============================================================
   スコア計算（設計書 4.5）
   ============================================================ */
function calcSlot(slot){
  const items = [];

  // 1. 個体スコア（色違いは2倍）
  slot.mons.forEach(m => {
    if(!m.name || m.name === KARAKARA) return;
    const base = SCORE[m.name] || 0;
    const value = m.shiny ? base * 2 : base;
    items.push({ text: m.name + (m.shiny ? "★" : ""), value, ghost: GHOST.has(m.name) });
  });

  // 2. 種族ボーナス（色違いでも倍にしない）
  FAMILIES.forEach(f => {
    const complete = f.members.every(n => slot.mons.some(m => m.name === n));
    if(complete){
      items.push({ text:"種族ボーナス(" + f.members.join("+") + ")", value:f.bonus });
    }
  });

  // 3. シルフスコープ：一番点の高いゴースト1体だけを2倍
  //    （色違い2倍の後の点で比べるので、色違いなら4倍。同点なら先に登録した1体）
  items.forEach(it => { it.final = it.value; });
  if(slot.scope){
    let top = null;
    items.forEach(it => {
      if(it.ghost && it.value > 0 && (top === null || it.value > top.value)) top = it;
    });
    if(top){
      top.final = top.value * 2;
      top.scoped = true;
    }
  }

  // 4. カラカラが出たら、何があってもスコアは0
  const karakara = slot.mons.some(m => m.name === KARAKARA);

  // 5. 合計
  const total = karakara ? 0 : items.reduce((sum, it) => sum + it.final, 0);
  return { total, items, karakara };
}

/* ============================================================
   画面の組み立て
   ============================================================ */
const daysEl = document.getElementById("days");

function buildOptions(){
  let html = '<option value="">— 選択 —</option>';
  GROUPS.forEach(g=>{
    html += '<optgroup label="' + g.name + '">';
    g.list.forEach(n=>{
      let note;
      if(n === KARAKARA){
        note = "スコア0";
      }else{
        const v = SCORE[n];
        note = v > 0 ? "+" + v : String(v);
      }
      html += '<option value="' + n + '">' + n + "（" + note + "）" + (GHOST.has(n) ? "👻" : "") + "</option>";
    });
    html += "</optgroup>";
  });
  return html;
}
const OPTIONS = buildOptions();

function buildMonRow(slot, mon, view){
  const row = document.createElement("div");
  row.className = "mon";

  const sel = document.createElement("select");
  sel.innerHTML = OPTIONS;
  sel.value = mon.name;
  sel.onchange = ()=>{ mon.name = sel.value; refresh(); };

  const lab = document.createElement("label");
  const shiny = document.createElement("input");
  shiny.type = "checkbox";
  shiny.checked = mon.shiny;
  shiny.onchange = ()=>{ mon.shiny = shiny.checked; refresh(); };
  lab.appendChild(shiny);
  lab.append("★色違い");

  const del = document.createElement("button");
  del.className = "del";
  del.textContent = "✕";
  del.title = "削除";
  del.onclick = ()=>{
    const i = slot.mons.indexOf(mon);
    if(i >= 0) slot.mons.splice(i, 1);
    row.remove();
    refresh();
  };

  row.append(sel, lab, del);
  view.monsEl.appendChild(row);
}

function buildSlot(dayData, slotIndex){
  const slot = dayData.slots[slotIndex];
  const wrap = document.createElement("div");
  wrap.className = "slot";

  // 見出し（枠番号・スコア）
  const head = document.createElement("div");
  head.className = "slot-head";
  const no = document.createElement("span");
  no.className = "slot-no";
  no.textContent = "リサーチ " + SLOT_MARK[slotIndex];
  const scoreEl = document.createElement("span");
  scoreEl.className = "slot-score";
  head.append(no, scoreEl);

  // リサーチ名
  const labelInput = document.createElement("input");
  labelInput.className = "label-input";
  labelInput.placeholder = "リサーチ名（任意）";
  labelInput.value = slot.label;
  labelInput.oninput = ()=>{ slot.label = labelInput.value; save(); };

  // ポケモン
  const monsEl = document.createElement("div");
  const addBtn = document.createElement("button");
  addBtn.textContent = "＋ポケモン追加";
  const countEl = document.createElement("span");
  countEl.className = "count";
  const addRow = document.createElement("div");
  addRow.className = "row";
  addRow.append(addBtn, countEl);

  // シルフスコープ
  const scopeBox = document.createElement("div");
  scopeBox.className = "scope-box";
  const scopeLabel = document.createElement("label");
  const scopeInput = document.createElement("input");
  scopeInput.type = "checkbox";
  scopeInput.checked = slot.scope;
  const scopeNote = document.createElement("span");
  scopeNote.className = "scope-note";
  scopeLabel.appendChild(scopeInput);
  scopeLabel.append("🔍 シルフスコープを使う");
  scopeBox.append(scopeLabel, scopeNote);

  // 内訳
  const detailEl = document.createElement("div");
  detailEl.className = "detail";

  // 写真・投稿
  const fileInput = document.createElement("input");
  fileInput.type = "file";
  fileInput.accept = "image/*";
  const photoEl = document.createElement("img");
  photoEl.className = "photo";
  photoEl.hidden = true;
  const imgBtn = document.createElement("button");
  imgBtn.textContent = "📷 投稿用画像を作る";
  imgBtn.disabled = true;
  const txtBtn = document.createElement("button");
  txtBtn.textContent = "📋 投稿文をコピー";
  const postText = document.createElement("textarea");
  postText.className = "post-text";
  postText.hidden = true;
  const postRow = document.createElement("div");
  postRow.className = "row";
  postRow.append(imgBtn, txtBtn);

  // 作った投稿用画像（iPhoneでは共有メニューの「画像を保存」で写真アプリに入る）
  const resultBox = document.createElement("div");
  resultBox.className = "result";
  resultBox.hidden = true;
  const resultImg = document.createElement("img");
  resultImg.alt = "投稿用画像";
  const shareBtn = document.createElement("button");
  shareBtn.className = "share";
  shareBtn.textContent = "📤 保存・共有する";
  const dlLink = document.createElement("a");
  dlLink.textContent = "ファイルとしてダウンロード";
  const resultRow = document.createElement("div");
  resultRow.className = "row";
  resultRow.append(shareBtn, dlLink);
  const resultNote = document.createElement("div");
  resultNote.className = "note";
  resultBox.append(resultImg, resultRow, resultNote);

  wrap.append(head, labelInput, monsEl, addRow, scopeBox, detailEl,
              fileInput, photoEl, postRow, postText, resultBox);

  const view = {
    slot, day: dayData.day, index: slotIndex,
    scoreEl, detailEl, scopeInput, scopeNote, addBtn, countEl, monsEl,
    photoEl, imgBtn, postText,
    resultBox, resultImg, shareBtn, dlLink, resultNote
  };
  views.push(view);

  // 既存データの行を並べる
  slot.mons.forEach(m => buildMonRow(slot, m, view));

  addBtn.onclick = ()=>{
    if(slot.mons.length >= MAX_MONS) return;
    const mon = { name:"", shiny:false };
    slot.mons.push(mon);
    buildMonRow(slot, mon, view);
    refresh();
  };

  scopeInput.onchange = ()=>{ slot.scope = scopeInput.checked; refresh(); };

  fileInput.onchange = ()=>{
    const f = fileInput.files[0];
    if(!f) return;
    const r = new FileReader();
    r.onload = ()=>{
      photos[view.day + "-" + view.index] = r.result;
      photoEl.src = r.result;
      photoEl.hidden = false;
      imgBtn.disabled = false;
      clearResult(view);
    };
    r.readAsDataURL(f);
  };

  imgBtn.onclick = ()=> makeImage(view);
  shareBtn.onclick = ()=> shareImage(view);
  txtBtn.onclick = ()=> copyPostText(view);

  return wrap;
}

/* 入力済みの枠か（ポケモン・リサーチ名・スコープのどれかがあれば入力済み）
   slotの形は emptySlot() で固定なので、項目を直接見て判定する。
   Object.values() で一括判定すると scope:false や mons:[] が「値あり」と見なされ、
   すべて入力済みになってしまうため使わない。 */
function hasInput(slot){
  return slot.mons.some(m => m.name) || slot.label.trim() !== "" || slot.scope === true;
}

/* 最後に入力したDAY（まだ何もなければ0） */
function lastEnteredDay(){
  for(let i = state.days.length - 1; i >= 0; i--){
    if(state.days[i].slots.some(hasInput)) return state.days[i].day;
  }
  return 0;
}

function buildAll(){
  // 開き直したときは「前回入力したDAY」と「その次のDAY」を開く。
  // 途中で1日飛ばしても、続きから再開できるようにするため。
  const last = lastEnteredDay();
  const openDays = last === 0 ? [1] : [last, last + 1];

  daysEl.innerHTML = ""; // 再描画時のために一旦クリア

  state.days.forEach(d => {
    const det = document.createElement("details");
    det.className = "day";
    det.open = openDays.includes(d.day);

    const sum = document.createElement("summary");
    const ttl = document.createElement("span");
    ttl.textContent = "DAY" + d.day;
    const best = document.createElement("span");
    best.className = "daybest";
    sum.append(ttl, best);
    det.appendChild(sum);
    det.dayBestEl = best;

    for(let i = 0; i < SLOTS_PER_DAY; i++){
      det.appendChild(buildSlot(d, i));
    }
    daysEl.appendChild(det);
    d._el = det;
  });
}

/* ============================================================
   再計算と表示更新
   ============================================================ */
function signed(v){ return v > 0 ? "+" + v : String(v); }

function refresh(){
  // スコープはイベント期間中1回だけ
  const scopeUsed = views.some(v => v.slot.scope);
  let best = null;

  views.forEach(v=>{
    const { total, items, karakara } = calcSlot(v.slot);
    v.total = total;
    v.items = items;

    // 作った後にスコアが変わったら、古い画像は消して作り直してもらう
    if(v.result && v.result.total !== total) clearResult(v);

    // スコア
    v.scoreEl.textContent = total + "点";
    v.scoreEl.className = "slot-score " + (total > 0 ? "p" : total < 0 ? "m" : "");

    // 内訳
    if(items.length === 0 && !karakara){
      v.detailEl.textContent = "ポケモンを追加すると内訳が出ます";
    }else{
      const lines = items.map(it=>{
        let line = it.text + "　" + signed(it.value);
        if(it.scoped) line += "　→ " + signed(it.final) + "（スコープ）";
        const cls = karakara ? "zeroed" : it.scoped ? "scoped" : "";
        return cls ? '<span class="' + cls + '">' + line + "</span>" : line;
      });
      if(karakara) lines.push('<span class="karakara">カラカラ出現 → スコア0</span>');
      v.detailEl.innerHTML = lines.join("<br>");
    }

    // ポケモン数
    v.countEl.textContent = v.slot.mons.length + " / " + MAX_MONS + " 体";
    v.addBtn.disabled = v.slot.mons.length >= MAX_MONS;

    // スコープの排他制御
    const locked = scopeUsed && !v.slot.scope;
    v.scopeInput.disabled = locked;
    v.scopeNote.textContent = v.slot.scope ? "（期間中1回のみ・使用中）"
                            : locked       ? "（他のリサーチで使用済み）"
                            : "";

    // ベストスコア候補（空の枠は対象外）
    const hasMon = v.slot.mons.some(m => m.name);
    if(hasMon && (best === null || total > best.total)) best = v;
  });

  // DAY見出しのベスト
  state.days.forEach(d=>{
    const dayViews = views.filter(v => v.day === d.day && v.slot.mons.some(m => m.name));
    d._el.dayBestEl.textContent = dayViews.length
      ? "最高 " + Math.max(...dayViews.map(v => v.total)) + "点"
      : "未記録";
  });

  // ベストスコア表示
  document.getElementById("bestVal").textContent = best
    ? "DAY" + best.day + " " + SLOT_MARK[best.index] + "　" + best.total + "点"
      + (best.slot.label ? "（" + best.slot.label + "）" : "")
    : "まだ記録がありません";

  save();
}

/* ============================================================
   X投稿用の出力
   ============================================================ */
function buildPostText(view){
  const names = view.slot.mons
    .filter(m => m.name)
    .map(m => m.name + (m.shiny ? "★" : ""));
  const lines = [
    "#ゴーストマスターズ",
    "DAY" + view.day + " " + SLOT_MARK[view.index] + "　" + view.total + "点"
  ];
  if(names.length) lines.push(names.join(" / "));
  if(view.slot.scope) lines.push("🔍シルフスコープ使用");
  return lines.join("\n");
}

function copyPostText(view){
  const text = buildPostText(view);
  view.postText.hidden = false;
  view.postText.value = text;
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text)
      .then(()=> alert("投稿文をコピーしました"))
      .catch(()=> view.postText.select());
  }else{
    view.postText.select();
  }
}

function makeImage(view){
  const src = photos[view.day + "-" + view.index];
  if(!src) return;

  const img = new Image();
  img.onload = ()=>{
    const maxW = 1080;
    const scale = Math.min(1, maxW / img.width);
    const w = Math.round(img.width * scale);
    const h = Math.round(img.height * scale);
    const barH = Math.round(w * 0.12);

    const c = document.createElement("canvas");
    c.width = w;
    c.height = h + barH;
    const ctx = c.getContext("2d");

    ctx.drawImage(img, 0, 0, w, h);

    // 下部にスコア帯を描く
    ctx.fillStyle = "#4a2c6b";
    ctx.fillRect(0, h, w, barH);
    ctx.fillStyle = "#fff";
    ctx.textBaseline = "middle";

    ctx.font = "bold " + Math.round(barH * 0.38) + "px sans-serif";
    ctx.textAlign = "left";
    ctx.fillText("DAY" + view.day + " " + SLOT_MARK[view.index], w * 0.04, h + barH * 0.5);

    ctx.font = "bold " + Math.round(barH * 0.52) + "px sans-serif";
    ctx.textAlign = "right";
    ctx.fillText(view.total + "点", w * 0.96, h + barH * 0.5);

    c.toBlob(blob=>{
      if(!blob) return;
      clearResult(view);
      const name = "ghostmasters_day" + view.day + "_" + (view.index + 1) + ".png";
      const file = new File([blob], name, { type:"image/png" });
      const url = URL.createObjectURL(blob);
      view.result = { file, url, total: view.total };

      view.resultImg.src = url;
      view.dlLink.href = url;
      view.dlLink.download = name;

      // 共有メニューにファイルを渡せる端末（iPhoneなど）は共有ボタンを出す。
      // ダウンロードだと iPhone では「ファイル」アプリに入ってしまうため。
      const canShare = !!(navigator.canShare && navigator.canShare({ files:[file] }));
      view.shareBtn.hidden = !canShare;
      view.resultNote.textContent = canShare
        ? "「保存・共有する」→「画像を保存」で写真アプリに保存できます。画像の長押しでも保存できます。"
        : "画像を長押し（パソコンは右クリック）して保存してください。";

      view.resultBox.hidden = false;
      view.resultBox.scrollIntoView({ behavior:"smooth", block:"nearest" });
    }, "image/png");
  };
  img.src = src;
}

/* 共有メニューを開く。画像の生成とは別のタップで呼ぶ
   （Safariはタップ直後でないと共有メニューを開かせてくれないため） */
function shareImage(view){
  if(!view.result) return;
  navigator.share({ files:[view.result.file] }).catch(e=>{
    if(e && e.name === "AbortError") return;   // 共有メニューを閉じただけ
    alert("共有できませんでした。画像を長押しして保存してください。");
  });
}

function clearResult(view){
  if(view.result){
    URL.revokeObjectURL(view.result.url);
    view.result = null;
  }
  view.resultBox.hidden = true;
  view.resultImg.removeAttribute("src");
}

/* ============================================================
   起動
   ============================================================ */
/* 開いたDAYまでスクロールする（ベストスコア帯に隠れないよう少し上に余白をとる） */
function scrollToOpenDay(){
  const last = lastEnteredDay();
  if(last === 0) return;               // 初回は先頭（DAY1）のまま
  const el = state.days[last - 1]._el;
  if(!el) return;
  const bar = document.querySelector(".best");
  const offset = (bar ? bar.offsetHeight : 0) + 8;
  const y = el.getBoundingClientRect().top + window.scrollY - offset;
  window.scrollTo(0, Math.max(0, y));
}

// ブラウザによる読み込み時の位置復元を止める（上の移動が打ち消されないように）
if("scrollRestoration" in history) history.scrollRestoration = "manual";

buildAll();
refresh();
scrollToOpenDay();
</script>
